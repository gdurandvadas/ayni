[checks]
test = true
coverage = true
size = true
complexity = true
deps = true
mutation = false

[languages]
enabled = ["rust"]

[concurrency]
amount = 1

[rust]
roots = [
  ".",
]
# Optional tool override examples:
# [rust.tooling.test]
# command = "cargo"
# args = ["test"]
#
# [rust.tooling.coverage]
# command = "cargo"
# args = ["llvm-cov", "--workspace", "--json", "--summary-only"]
#
# [rust.tooling.mutation]
# command = "cargo"
# args = ["mutants", "--list"]

[rust.size]
"*.rs" = { warn = 1600, fail = 2000, exclude = ["target/**"] }

[rust.complexity]
fn_cyclomatic = { warn = 15, fail = 20 }
fn_cognitive   = { warn = 29, fail = 35 }

[rust.coverage]
line_percent = { warn = 40, fail = 35 }

[rust.deps.forbidden]
"core"          = ["adapters/*", "cli"]
"adapters/*"    = ["cli"]
