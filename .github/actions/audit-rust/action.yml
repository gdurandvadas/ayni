name: Audit locked Rust dependencies
description: Cache the pinned audit executable while fetching current advisory data on every run.
runs:
  using: composite
  steps:
    - name: Restore pinned audit executable
      id: audit-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ayni-ci/cargo-audit-0.22.2
        key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v1
    - name: Install audit build toolchain on cache miss
      if: steps.audit-cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
    - name: Install pinned audit executable on cache miss
      if: steps.audit-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-audit --version 0.22.2 --locked --root "$HOME/.cache/ayni-ci/cargo-audit-0.22.2"
    - name: Audit with current advisory data
      shell: bash
      run: |
        set -euo pipefail
        audit="$HOME/.cache/ayni-ci/cargo-audit-0.22.2/bin/cargo-audit"
        test "$("$audit" --version)" = "cargo-audit 0.22.2"
        "$audit" audit
