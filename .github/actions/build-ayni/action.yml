name: Build Ayni CLI
description: Install the pinned Rust toolchain, restore the shared cache, and build the checkout CLI.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ayni-cli-validation

    - name: Build Ayni CLI
      shell: bash
      run: cargo build --locked -p ayni-cli
