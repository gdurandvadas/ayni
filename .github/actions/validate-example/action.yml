name: Validate Ayni example
description: Run the checkout CLI through one language fixture's managed environment and validate its typed artifact.

inputs:
  language:
    description: Adapter language expected in the artifact.
    required: true
  fixture:
    description: Repository-relative mono fixture root.
    required: true
  expected-roots:
    description: Newline-separated configured roots expected in the artifact.
    required: true
  base:
    description: Optional pullable checkout-base digest to reuse within an existing job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build pullable checkout-local managed environment base
      id: base
      if: ${{ inputs.base == '' }}
      uses: ./.github/actions/build-local-environment-base

    - name: Lock and build fixture environment
      shell: bash
      env:
        FIXTURE: ${{ inputs.fixture }}
        BASE: ${{ inputs.base || steps.base.outputs.reference }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        rm -rf "$FIXTURE/.ayni" "$FIXTURE/.ayni.lock"
        python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-example-$LANGUAGE/timings.jsonl" --stage lock -- ./target/debug/ayni env lock \
          --repo-root "$FIXTURE" \
          --config .ayni.toml
        python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-example-$LANGUAGE/timings.jsonl" --stage build-and-prepare -- ./target/debug/ayni env build --repo-root "$FIXTURE" --executor-image "$BASE"
        python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-example-$LANGUAGE/timings.jsonl" --stage doctor -- ./target/debug/ayni env doctor --repo-root "$FIXTURE"

    - name: Check fixture and validate typed artifact
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        FIXTURE: ${{ inputs.fixture }}
        EXPECTED_ROOTS: ${{ inputs.expected-roots }}
      run: |
        set +e
        python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-example-$LANGUAGE/timings.jsonl" --stage check -- ./target/debug/ayni check --config "$FIXTURE/.ayni.toml"
        check_code=$?
        set -e
        echo "Ayni managed check exit code: $check_code"

        root_args=()
        while IFS= read -r root; do
          if [[ -n "$root" ]]; then
            root_args+=(--expected-root "$root")
          fi
        done <<< "$EXPECTED_ROOTS"

        python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-example-$LANGUAGE/timings.jsonl" --stage validate -- python3 scripts/ci/validate_example_artifact.py \
          --artifact "$FIXTURE/.ayni/last/signals.json" \
          --language "$LANGUAGE" \
          --repository-root /workspace \
          --check-exit-code "$check_code" \
          "${root_args[@]}"

    - name: Retain fixture evidence before cleanup
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: managed-example-${{ inputs.language }}
        path: |
          ${{ inputs.fixture }}/.ayni.lock
          ${{ inputs.fixture }}/.ayni/last/signals.json
          ${{ inputs.fixture }}/.ayni/last/execution.json
          ${{ inputs.fixture }}/.ayni/environment/build.json
          ${{ runner.temp }}/ayni-example-${{ inputs.language }}/timings.jsonl
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: error

    - name: Remove ephemeral environment state
      if: always()
      shell: bash
      env:
        FIXTURE: ${{ inputs.fixture }}
      run: rm -rf "$FIXTURE/.ayni" "$FIXTURE/.ayni.lock"
