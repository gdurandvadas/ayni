name: ayni-rust

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository:
    name: check Ayni repository (self)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ayni-rust-self

      - name: Install pinned Mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Build Ayni CLI
        run: cargo build --locked -p ayni-cli

      - name: Build checkout-local managed environment base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-local-environment-image.sh
          base_id="$(docker image inspect ayni-env:local --format '{{.Id}}')"
          echo "reference=ayni-env:local@${base_id}" >> "$GITHUB_OUTPUT"

      - name: Verify the committed environment lock is current
        env:
          BASE: ${{ steps.base.outputs.reference }}
        run: |
          set -euo pipefail
          ./target/debug/ayni env lock --config ./.ayni.toml --base "$BASE"
          git diff --exit-code -- .ayni.lock

      - name: Build and diagnose the committed managed environment
        run: |
          set -euo pipefail
          ./target/debug/ayni env build
          ./target/debug/ayni env doctor

      - name: Run Ayni through the managed path
        id: check
        shell: bash
        run: |
          set +e
          summary_file="$RUNNER_TEMP/ayni-summary.md"
          ./target/debug/ayni check --config ./.ayni.toml --output markdown | tee "$summary_file"
          code="${PIPESTATUS[0]}"
          summary="$(<"$summary_file")"
          if [[ "$code" != "0" ]]; then
            echo "::group::full rust test diagnostics"
            cargo test --locked --workspace --all-features || true
            echo "::endgroup::"
          fi
          {
            echo "summary<<EOF"
            printf '%s\n' "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upsert Ayni PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          AYNI_BRANCH: ${{ github.head_ref || github.ref_name }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const branch = process.env.AYNI_BRANCH || "unknown";
            const marker = `<!-- ayni:md branch=${branch} -->`;
            const summary = process.env.SUMMARY?.trim() || "_No markdown summary output found._";
            const body = [marker, summary].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Evaluate Ayni command status
        if: always()
        shell: bash
        run: |
          check_code="${{ steps.check.outputs.exit_code }}"
          echo "check exit code: ${check_code:-unset}"
          if [[ -z "$check_code" ]]; then
            echo "Missing Ayni check exit code"
            exit 1
          fi
          if [[ "$check_code" != "0" ]]; then
            echo "Ayni managed check failed"
            exit 1
          fi
          echo "Ayni managed check succeeded"
