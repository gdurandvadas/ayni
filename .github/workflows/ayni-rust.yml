name: ayni-rust

on:
  workflow_call:

jobs:
  repository:
    name: check Ayni repository (self)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ayni-rust-self

      - name: Install pinned Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Build Ayni CLI
        run: cargo build --locked -p ayni-cli

      - name: Build pullable checkout-local managed environment base
        id: base
        uses: ./.github/actions/build-local-environment-base

      - name: Build and diagnose the committed managed environment
        env:
          EXECUTOR: ${{ steps.base.outputs.reference }}
        run: |
          set -euo pipefail
          python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-repository/timings.jsonl" --stage build-and-prepare -- ./target/debug/ayni env build --executor-image "$EXECUTOR"
          python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-repository/timings.jsonl" --stage doctor -- ./target/debug/ayni env doctor

      - name: Run Ayni through the managed path
        id: check
        shell: bash
        run: |
          set +e
          summary_file="$RUNNER_TEMP/ayni-summary.md"
          python3 scripts/ci/timed.py --output "$RUNNER_TEMP/ayni-repository/timings.jsonl" --stage check -- ./target/debug/ayni check --config ./.ayni.toml --output markdown | tee "$summary_file"
          code="${PIPESTATUS[0]}"
          summary="$(<"$summary_file")"
          if [[ "$code" != "0" ]]; then
            echo "::group::full rust test diagnostics"
            cargo test --locked --workspace --all-features || true
            echo "::endgroup::"
          fi
          {
            echo "summary<<EOF"
            printf '%s\n' "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain repository evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-repository
          path: |
            .ayni.lock
            .ayni/last/signals.json
            .ayni/last/execution.json
            .ayni/environment/build.json
            ${{ runner.temp }}/ayni-lock.committed.json
            ${{ runner.temp }}/ayni-repository/timings.jsonl
            ${{ runner.temp }}/ayni-summary.md
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Validate Rust mono example through managed execution
        uses: ./.github/actions/validate-example
        with:
          language: rust
          fixture: examples/rust/mono
          expected-roots: .
          base: ${{ steps.base.outputs.reference }}

      - name: Upsert Ayni PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AYNI_BRANCH: ${{ github.head_ref || github.ref_name }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const branch = process.env.AYNI_BRANCH || "unknown";
            const marker = `<!-- ayni:md branch=${branch} -->`;
            const summary = process.env.SUMMARY?.trim() || "_No markdown summary output found._";
            const body = [marker, summary].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Evaluate Ayni command status
        if: always()
        shell: bash
        run: |
          check_code="${{ steps.check.outputs.exit_code }}"
          echo "check exit code: ${check_code:-unset}"
          if [[ -z "$check_code" ]]; then
            echo "Missing Ayni check exit code"
            exit 1
          fi
          if [[ "$check_code" != "0" ]]; then
            echo "Ayni managed check failed"
            exit 1
          fi
          echo "Ayni managed check succeeded"
