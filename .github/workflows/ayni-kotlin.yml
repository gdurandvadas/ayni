name: ayni-kotlin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate Kotlin mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Install pinned Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Validate Kotlin example through managed execution
        uses: ./.github/actions/validate-example
        with:
          language: kotlin
          fixture: examples/kotlin/mono
          expected-roots: .
