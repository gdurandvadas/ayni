name: ayni-kotlin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate Kotlin mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Install pinned Mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Validate Kotlin example through managed execution
        uses: ./.github/actions/validate-example
        with:
          language: kotlin
          fixture: examples/kotlin/mono
          expected-roots: .
