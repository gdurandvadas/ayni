name: ayni-quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Audit locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/cargo-audit-0.22.2"
          cargo install cargo-audit --version 0.22.2 --locked --root "$audit_root"
          export PATH="$audit_root/bin:$PATH"
          cargo audit

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ayni-quality

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Check
        run: cargo check --locked --workspace --all-features

      - name: Test example artifact validator
        run: python3 scripts/ci/test_validate_example_artifact.py

      - name: Verify immutable GitHub Action references
        run: python3 scripts/ci/validate_workflow_pins.py

  documentation:
    name: documentation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Verify generated CLI documentation
        run: |
          set -euo pipefail
          cargo doc-cli > "$RUNNER_TEMP/cli.md"
          diff --unified docs/cli.md "$RUNNER_TEMP/cli.md"

      - name: Build VitePress
        env:
          VITEPRESS_BASE: /
        run: npm run docs:build
