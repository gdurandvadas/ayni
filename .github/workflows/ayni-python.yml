name: ayni-python

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate Python mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'

      - name: Install pinned uv and sync the native lock
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.9
          uv sync --frozen --project examples/python/mono

      - name: Validate Python example
        uses: ./.github/actions/validate-example
        with:
          language: python
          fixture: examples/python/mono
          expected-roots: .
