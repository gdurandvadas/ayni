name: ayni-node

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate Node mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Install pinned Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Validate Node example through managed execution
        uses: ./.github/actions/validate-example
        with:
          language: node
          fixture: examples/node/mono
          expected-roots: .
