name: ayni-go

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate Go mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: examples/go/mono/go.sum

      - name: Install Go signal tools
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Validate Go example
        uses: ./.github/actions/validate-example
        with:
          language: go
          fixture: examples/go/mono
          expected-roots: .
