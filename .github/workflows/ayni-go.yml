name: ayni-go

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate Go mono example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Ayni CLI
        uses: ./.github/actions/build-ayni

      - name: Install pinned Mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Validate Go example through managed execution
        uses: ./.github/actions/validate-example
        with:
          language: go
          fixture: examples/go/mono
          expected-roots: .
