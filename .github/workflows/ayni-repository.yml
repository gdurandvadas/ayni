name: ayni-repository

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: repository (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import verified candidate
        id: candidate
        uses: ./.github/actions/use-candidate
        with:
          arch: ${{ matrix.arch }}
      - name: Install pinned Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: false
          cache: false
      - name: Configure PR environment cache
        id: cache
        uses: ./.github/actions/setup-environment-cache
        with:
          scope: pr-repository-${{ matrix.arch }}
      - name: Run managed contract
        env:
          AYNI: ${{ steps.candidate.outputs.cli }}
          EXECUTOR: ${{ steps.candidate.outputs.executor }}
          PLATFORM: linux/${{ matrix.arch }}
          CACHE_FROM: ${{ steps.cache.outputs.from }}
          CACHE_TO: ${{ steps.cache.outputs.to }}
        run: |
          python3 scripts/ci/run_fixture.py --cli "$AYNI" --executor-image "$EXECUTOR" \
            --fixture-root . --id repository --committed-lock --expected-exit-code 0 \
            --source "$GITHUB_SHA" --platform "$PLATFORM" \
            --cache-from "$CACHE_FROM" --cache-to "$CACHE_TO" \
            --artifact-directory "$RUNNER_TEMP/managed-repository"
      - name: Retain evidence before cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-repository-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-repository/
          retention-days: 14
          if-no-files-found: error
      - name: Clean job-local registry
        if: always()
        run: docker rm --force ayni-local-registry || true
