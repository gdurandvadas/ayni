name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Ayni release tag whose assets and managed image should be rebuilt
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    concurrency:
      group: release-metadata
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Publish only explicit shell-normalized values. Do not compose action
      # outputs in job outputs: a falsey skipped-step operand can collapse the
      # value while later steps in this job still observe the action output.
      release_created: ${{ steps.release-metadata.outputs.release_created }}
      release_tag: ${{ steps.release-metadata.outputs.tag }}
      release_version: ${{ steps.release-metadata.outputs.version }}
      release_commit: ${{ steps.release-source.outputs.commit }}
      release_pr_created: ${{ steps.release-pr.outputs.created }}
      release_pr_branch: ${{ steps.release-pr.outputs.branch }}

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release app token
        id: app-token
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve existing release metadata
        id: manual-release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main"
          if [[ ! "$RELEASE_TAG" =~ ^ayni-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must match ayni-v<semver>" >&2
            exit 1
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq --raw-output '.draft' <<<"$release")" = "false"
          test "$(jq --raw-output '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          {
            echo "release_created=true"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#ayni-v}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize release metadata for downstream jobs
        id: release-metadata
        if: ${{ steps.manual-release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.manual-release.outputs.tag || steps.release.outputs.tag_name }}
          VERSION: ${{ steps.manual-release.outputs.version || steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test "$TAG" = "ayni-v${VERSION}"
          {
            echo "release_created=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release source commit
        id: release-source
        if: ${{ steps.release-metadata.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-metadata.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 scripts/ci/release_artifacts.py source --tag "$TAG")"
          test "$sha" != ""
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$sha" = "$TRIGGER_COMMIT"
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve release pull request branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(jq --raw-output '.[0].headBranchName // empty' <<<"$RELEASE_PRS")"
          test -n "$branch"
          {
            echo "created=true"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

  sync-release-lock:
    concurrency:
      group: release-pr-maintenance
      cancel-in-progress: false
    name: synchronize release managed lock
    runs-on: ubuntu-latest
    needs: release
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        needs.release.outputs.release_pr_created == 'true'
      }}
    permissions: {}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.release_pr_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Regenerate managed lock with the durable base
        run: |
          set -euo pipefail
          base="$(jq -r '.provisioning_base.reference + "@" + .provisioning_base.digest' .ayni.lock)"
          cargo run --locked -p ayni-cli -- env lock --config ./.ayni.toml --base "$base"
          cp .ayni.lock "$RUNNER_TEMP/release-lock.first"
          cargo run --locked -p ayni-cli -- env lock --config ./.ayni.toml --base "$base"
          cmp "$RUNNER_TEMP/release-lock.first" .ayni.lock

      - name: Commit managed lock
        env:
          BRANCH: ${{ needs.release.outputs.release_pr_branch }}
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .ayni.lock; then
            exit 0
          fi
          git config user.name "ayni-release[bot]"
          git config user.email "282289292+ayni-release[bot]@users.noreply.github.com"
          git add -- .ayni.lock
          git commit -m "chore(release): refresh managed lock"
          git push "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"

  publication:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    concurrency:
      group: release-publication-${{ needs.release.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-publication.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
      version: ${{ needs.release.outputs.release_version }}
      commit: ${{ needs.release.outputs.release_commit }}
    secrets: inherit

  release-completion:
    name: require complete public release
    runs-on: ubuntu-latest
    needs:
      - release
      - publication
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      - name: Checkout completion helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed when publication is incomplete
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_RESULT" = "success"

          resolve_tag_commit() {
            python3 scripts/ci/release_artifacts.py source --tag "$1"
          }

          publication_required=false
          detected_tag=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$RELEASE_CREATED" == "true" ]]; then
            publication_required=true
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            encoded_version="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/version.txt?ref=${GITHUB_SHA}" \
              --jq '.content')"
            source_version="$(printf '%s' "$encoded_version" | base64 --decode | tr -d '\r\n')"
            [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
            candidate_tag="ayni-v${source_version}"
            set +e
            lookup="$(gh api --include \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" 2>&1)"
            lookup_code=$?
            set -e
            if [[ "$lookup_code" -eq 0 ]]; then
              candidate_commit="$(resolve_tag_commit "$candidate_tag")"
              if [[ "$candidate_commit" == "$GITHUB_SHA" ]]; then
                detected_tag="$candidate_tag"
                publication_required=true
              fi
            elif grep -Eq '^HTTP/[^ ]+ 404 ' <<< "$lookup"; then
              : # An authoritative 404 means this ordinary push created no release.
            else
              printf '%s\n' "$lookup" >&2
              exit "$lookup_code"
            fi
          fi

          if [[ "$publication_required" != "true" ]]; then
            echo "No release was created; publication jobs are not required."
            exit 0
          fi

          if [[ -n "$detected_tag" && "$RELEASE_CREATED" != "true" ]]; then
            echo "Public release $detected_tag exists for $GITHUB_SHA, but release metadata did not propagate." >&2
          fi
          test "$RELEASE_CREATED" = "true"
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" = "ayni-v${RELEASE_VERSION}"
          if [[ -n "$detected_tag" ]]; then
            test "$RELEASE_TAG" = "$detected_tag"
          fi
          test -n "$RELEASE_COMMIT"
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          fi
          while read -r job result; do
            if [[ "$result" != "success" ]]; then
              echo "Required release job '$job' concluded '$result'." >&2
              exit 1
            fi
          done <<EOF
          publication $PUBLICATION_RESULT
          EOF

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq --raw-output '.draft' <<< "$release")" = "false"
          test "$(jq --raw-output '.tag_name' <<< "$release")" = "$RELEASE_TAG"
          test "$(resolve_tag_commit "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          test "$(jq '.assets | length' <<< "$release")" -eq 5
