name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
      release_pr_created: ${{ steps.release.outputs.prs_created }}
      release_pr_branch: ${{ steps.release-pr.outputs.branch }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release pull request branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(jq --raw-output '.[0].headBranchName // empty' <<<"$RELEASE_PRS")"
          test -n "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  sync-release-lock:
    name: synchronize release managed lock
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_pr_created == 'true' }}
    permissions: {}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.release_pr_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pinned Mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Build pullable checkout-local managed environment base
        id: base
        uses: ./.github/actions/build-local-environment-base

      - name: Regenerate managed lock
        env:
          BASE: ${{ steps.base.outputs.reference }}
        run: ./target/release/ayni env lock --config ./.ayni.toml --base "$BASE"

      - name: Commit managed lock
        env:
          BRANCH: ${{ needs.release.outputs.release_pr_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .ayni.lock; then
            exit 0
          fi
          git config user.name "ayni-release[bot]"
          git config user.email "282289292+ayni-release[bot]@users.noreply.github.com"
          git add -- .ayni.lock
          git commit -m "chore(release): refresh managed lock"
          git push origin "HEAD:$BRANCH"

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build ayni
        run: cargo build --locked -p ayni-cli --release --target ${{ matrix.target }}

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p "dist/ayni-${TAG}-${TARGET}"
          cp "target/${TARGET}/release/ayni" "dist/ayni-${TAG}-${TARGET}/"
          cp LICENSE NOTICE "dist/ayni-${TAG}-${TARGET}/"
          ARCHIVE="ayni-${TAG}-${TARGET}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" "ayni-${TAG}-${TARGET}"
          shasum -a 256 "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    # Release Please creates the public release before downstream jobs run.
    # Keep validation independent so successful builds publish assets promptly.
    needs:
      - release
      - build
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist

      - name: Build checksum manifest
        run: |
          set -euo pipefail
          find dist -type f -name "*.sha256" -print0 | sort -z | xargs -0 cat > dist/SHA256SUMS

      - name: Upload release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: |
            dist/**/*.tar.gz
            dist/SHA256SUMS

  environment-image:
    name: environment image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs:
      - release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Build Bookworm-compatible Ayni binary
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          test -n "$rust_version"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/tmp/cargo \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "rust:${rust_version}-bookworm" \
            cargo build --locked -p ayni-cli --release
          cp target/release/ayni .github/docker/ayni

      - name: Prepare image context
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE NOTICE .github/docker/
          source .github/docker/ayni-env.versions
          {
            echo "mise_version=$MISE_VERSION"
            echo "mise_sha256_amd64=$MISE_SHA256_AMD64"
            echo "mise_sha256_arm64=$MISE_SHA256_ARM64"
            echo "debian_image=$DEBIAN_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .github/docker
          file: .github/docker/ayni-env.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/gdurandvadas/ayni-env:${{ needs.release.outputs.release_version }}-debian-${{ matrix.arch }}
          build-args: |
            DEBIAN_IMAGE=${{ steps.versions.outputs.debian_image }}
            AYNI_VERSION=${{ needs.release.outputs.release_version }}
            SOURCE_REVISION=${{ github.sha }}
            MISE_VERSION=${{ steps.versions.outputs.mise_version }}
            MISE_SHA256_AMD64=${{ steps.versions.outputs.mise_sha256_amd64 }}
            MISE_SHA256_ARM64=${{ steps.versions.outputs.mise_sha256_arm64 }}

  environment-manifest:
    name: environment image manifest
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.publish-manifest.outputs.base }}
    needs:
      - release
      - environment-image
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-architecture tag
        id: publish-manifest
        env:
          VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/gdurandvadas/ayni-env:${VERSION}-debian"
          docker buildx imagetools create \
            --tag "$image" \
            "${image}-amd64" \
            "${image}-arm64"
          inspection="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspection"
          digest="$(printf '%s\n' "$inspection" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          test -n "$digest"
          echo "base=${image}@${digest}" >> "$GITHUB_OUTPUT"

  release-validation:
    name: validate released managed evidence (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs:
      - release
      - build
      - environment-manifest
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: [rust, go, node, python, kotlin]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          persist-credentials: false

      - name: Download released Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-x86_64-unknown-linux-gnu
          path: release-artifact

      - name: Extract released Ayni
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find release-artifact -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p released
          tar -xzf "$archive" -C released
          binary="$(find released -type f -name ayni -print -quit)"
          test -x "$binary"
          echo "path=$binary" >> "$GITHUB_OUTPUT"
          "$binary" --version

      - name: Install pinned Mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.6.14
          install: false
          cache: false

      - name: Lock and build released managed fixture
        env:
          AYNI: ${{ steps.binary.outputs.path }}
          BASE: ${{ needs.environment-manifest.outputs.base }}
          FIXTURE: examples/${{ matrix.language }}/mono
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE/.ayni" "$FIXTURE/.ayni.lock"
          "$AYNI" env lock \
            --repo-root "$FIXTURE" \
            --config .ayni.toml \
            --base "$BASE"
          "$AYNI" env build --repo-root "$FIXTURE"
          "$AYNI" env doctor --repo-root "$FIXTURE"

      - name: Validate released managed evidence
        env:
          AYNI: ${{ steps.binary.outputs.path }}
          FIXTURE: examples/${{ matrix.language }}/mono
          LANGUAGE: ${{ matrix.language }}
        run: |
          set +e
          "$AYNI" check --config "$FIXTURE/.ayni.toml"
          check_code=$?
          set -e
          echo "Released managed check exit code: $check_code"
          python3 scripts/ci/validate_example_artifact.py \
            --artifact "$FIXTURE/.ayni/last/signals.json" \
            --language "$LANGUAGE" \
            --repository-root . \
            --check-exit-code "$check_code" \
            --expected-root .

      - name: Remove ephemeral environment state
        if: always()
        env:
          FIXTURE: examples/${{ matrix.language }}/mono
        run: rm -rf "$FIXTURE/.ayni" "$FIXTURE/.ayni.lock"
