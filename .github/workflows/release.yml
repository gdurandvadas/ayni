name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build ayni
        run: cargo build --locked -p ayni-cli --release --target ${{ matrix.target }}

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p "dist/ayni-${TAG}-${TARGET}"
          cp "target/${TARGET}/release/ayni" "dist/ayni-${TAG}-${TARGET}/"
          cp LICENSE NOTICE "dist/ayni-${TAG}-${TARGET}/"
          ARCHIVE="ayni-${TAG}-${TARGET}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" "ayni-${TAG}-${TARGET}"
          shasum -a 256 "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - release
      - build
    if: ${{ needs.release.outputs.release_created == 'true' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Build checksum manifest
        run: |
          set -euo pipefail
          find dist -type f -name "*.sha256" -print0 | sort -z | xargs -0 cat > dist/SHA256SUMS

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: |
            dist/**/*.tar.gz
            dist/SHA256SUMS

  environment-image:
    name: environment image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs:
      - release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Build Bookworm-compatible Ayni binary
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          test -n "$rust_version"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/tmp/cargo \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "rust:${rust_version}-bookworm" \
            cargo build --locked -p ayni-cli --release
          cp target/release/ayni .github/docker/ayni

      - name: Prepare image context
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE NOTICE .github/docker/
          source .github/docker/ayni-env.versions
          {
            echo "mise_version=$MISE_VERSION"
            echo "mise_sha256_amd64=$MISE_SHA256_AMD64"
            echo "mise_sha256_arm64=$MISE_SHA256_ARM64"
            echo "debian_image=$DEBIAN_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/ayni-env.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/gdurandvadas/ayni-env:${{ needs.release.outputs.release_version }}-debian-${{ matrix.arch }}
          build-args: |
            DEBIAN_IMAGE=${{ steps.versions.outputs.debian_image }}
            AYNI_VERSION=${{ needs.release.outputs.release_version }}
            SOURCE_REVISION=${{ github.sha }}
            MISE_VERSION=${{ steps.versions.outputs.mise_version }}
            MISE_SHA256_AMD64=${{ steps.versions.outputs.mise_sha256_amd64 }}
            MISE_SHA256_ARM64=${{ steps.versions.outputs.mise_sha256_arm64 }}

  environment-manifest:
    name: environment image manifest
    runs-on: ubuntu-latest
    needs:
      - release
      - environment-image
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-architecture tag
        env:
          VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/gdurandvadas/ayni-env:${VERSION}-debian"
          docker buildx imagetools create \
            --tag "$image" \
            "${image}-amd64" \
            "${image}-arm64"
          docker buildx imagetools inspect "$image"
