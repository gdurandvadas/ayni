name: publish-ayni-rust-ci

on:
  push:
    branches:
      - main
    paths:
      - .ayni.lock
      - rust-toolchain.toml
      - .github/docker/ayni-rust-ci.Dockerfile
      - .github/workflows/publish-ayni-rust-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Rust CI image versions from repo sources
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          rust_version="$(jq -r '.targets[] | select(.target.language == "rust" and .target.root == ".") | .runtimes[] | select(.runtime == "rust") | .version' .ayni.lock)"
          cargo_llvm_cov_version="$(jq -r '.targets[] | select(.target.language == "rust" and .target.root == ".") | .signal_tools[] | select(.tool == "cargo-llvm-cov") | .version' .ayni.lock)"
          rust_code_analysis_cli_version="$(jq -r '.targets[] | select(.target.language == "rust" and .target.root == ".") | .signal_tools[] | select(.tool == "rust-code-analysis-cli") | .version' .ayni.lock)"

          if [ -z "${rust_version}" ]; then
            echo "Missing locked Rust runtime in .ayni.lock" >&2
            exit 1
          fi

          if [ -z "${cargo_llvm_cov_version}" ]; then
            echo "Missing cargo-llvm-cov version in .ayni.lock" >&2
            exit 1
          fi

          if [ -z "${rust_code_analysis_cli_version}" ]; then
            echo "Missing rust-code-analysis-cli version in .ayni.lock" >&2
            exit 1
          fi

          echo "rust_version=${rust_version}" >> "${GITHUB_OUTPUT}"
          echo "cargo_llvm_cov_version=${cargo_llvm_cov_version}" >> "${GITHUB_OUTPUT}"
          echo "rust_code_analysis_cli_version=${rust_code_analysis_cli_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gdurandvadas/ayni-rust-ci
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ayni-rust-ci.Dockerfile
          push: true
          build-args: |
            RUST_VERSION=${{ steps.versions.outputs.rust_version }}
            CARGO_LLVM_COV_VERSION=${{ steps.versions.outputs.cargo_llvm_cov_version }}
            RUST_CODE_ANALYSIS_CLI_VERSION=${{ steps.versions.outputs.rust_code_analysis_cli_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
