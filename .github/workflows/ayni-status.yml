name: ayni-status

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ayni-rust.yml

  quality:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    uses: ./.github/workflows/ayni-quality.yml

  go:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    uses: ./.github/workflows/ayni-go.yml

  kotlin:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    uses: ./.github/workflows/ayni-kotlin.yml

  node:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    uses: ./.github/workflows/ayni-node.yml

  python:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !contains(github.event.pull_request.labels.*.name, 'dependencies')
      }}
    uses: ./.github/workflows/ayni-python.yml

  status:
    name: status
    if: ${{ always() }}
    needs:
      - repository
      - quality
      - go
      - kotlin
      - node
      - python
    runs-on: ubuntu-latest
    env:
      DEPENDABOT_DEPENDENCY_PR: >-
        ${{
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          contains(github.event.pull_request.labels.*.name, 'dependencies')
        }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      GO_RESULT: ${{ needs.go.result }}
      KOTLIN_RESULT: ${{ needs.kotlin.result }}
      NODE_RESULT: ${{ needs.node.result }}
      PYTHON_RESULT: ${{ needs.python.result }}
    steps:
      - name: Resolve Ayni validation status
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPENDABOT_DEPENDENCY_PR" == "true" ]]; then
            echo "Dependabot dependency PR detected; expensive Ayni validation is deferred to release work."
            exit 0
          fi

          failed=0
          for result_name in \
            REPOSITORY_RESULT QUALITY_RESULT GO_RESULT \
            KOTLIN_RESULT NODE_RESULT PYTHON_RESULT
          do
            result="${!result_name}"
            echo "${result_name}=${result}"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" != "0" ]]; then
            echo "At least one required Ayni validation workflow did not succeed" >&2
            exit 1
          fi
